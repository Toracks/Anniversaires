<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Anniversaires</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-box h1 {
      font-family: 'Fraunces', serif;
      font-size: 1.4rem;
      margin: 0 0 24px;
    }
    .login-box input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      font-family: inherit;
    }
    .login-box input[type="password"]:focus { border-color: var(--accent); }
    .login-erreur {
      color: var(--danger);
      font-size: 0.82rem;
      margin-bottom: 14px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>🎂 Anniversaires</h1>
      <form method="POST">
        <input type="password" name="mot_de_passe" placeholder="Mot de passe" autofocus required>
        <div class="login-erreur">{{ erreur or '' }}</div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
